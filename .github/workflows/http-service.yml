name: HTTP service and C++ SDK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: http-service-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-http-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-http-${{ runner.os }}-
      - name: Kotlin tests and protocol generation
        run: |
          . .\jdk-setup.ps1
          $jdk = Ensure-Jdk
          $env:YUNX_DESKTOP_DATA_DIR = Join-Path $env:RUNNER_TEMP 'yunx-http-tests'
          Invoke-Gradle ':desktop:testInProcess' '--console=plain'
          if ($LASTEXITCODE -ne 0) { throw 'Kotlin tests failed' }
          git diff --exit-code -- sdk/cpp/include/yunx_client.hpp
          if ($LASTEXITCODE -ne 0) { throw 'Regenerate the C++ SDK with api/generate.ps1' }
      - name: Compile minimal C++ example and smoke client
        run: .\sdk\cpp\build.ps1 -Tests
      - name: Build portable service
        run: .\portable-package.ps1
      - name: Test packaged service with C++ SDK
        run: .\ci\http-smoke.ps1
      - name: Test Chromium login startup and window close
        run: .\ci\http-smoke.ps1 -LoginPlatform quark
      - name: Assemble artifacts
        run: |
          Compress-Archive -Path release/YunX-Desktop -DestinationPath build/YunX-HTTP-windows-x64.zip
          $sdk = 'build/sdk'
          New-Item -ItemType Directory -Force -Path "$sdk/include/nlohmann" | Out-Null
          Copy-Item sdk/cpp/include/yunx_client.hpp "$sdk/include/"
          Copy-Item build/cpp/deps/nlohmann/json.hpp "$sdk/include/nlohmann/"
          Copy-Item sdk/cpp/example.cpp "$sdk/"
          Copy-Item docs/HTTP-API.md "$sdk/"
          Copy-Item LICENSE "$sdk/"
          Compress-Archive -Path "$sdk/*" -DestinationPath build/YunX-HTTP-cpp-sdk.zip
      - uses: actions/upload-artifact@v4
        with:
          name: YunX-HTTP-windows-x64
          path: |
            build/YunX-HTTP-windows-x64.zip
            build/YunX-HTTP-cpp-sdk.zip
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: http-service-diagnostics
          path: |
            build/http-smoke/*.log
            desktop/build/test-results/

  release:
    name: Publish GitHub Release
    needs: windows
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: YunX-HTTP-windows-x64
          path: release-assets
      - name: Publish tested service and C++ SDK
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_BUILD: ${{ github.run_number }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content version.txt -Raw).Trim()
          $tag = "http-v$version-build.$env:RELEASE_BUILD"
          $assets = @('release-assets/YunX-HTTP-windows-x64.zip', 'release-assets/YunX-HTTP-cpp-sdk.zip')
          $notes = @"
          YunX HTTP $version (build $env:RELEASE_BUILD)

          - YunX-HTTP-windows-x64.zip: Windows x64 portable HTTP service, with Java runtime and Chromium login window.
          - YunX-HTTP-cpp-sdk.zip: C++17 header SDK, JSON dependency, minimal example and API documentation.

          Validation: Kotlin tests, C++ compilation, packaged HTTP service and Chromium login lifecycle checks passed.
          Commit: $env:RELEASE_COMMIT
          Build: $env:RELEASE_RUN_URL
          "@
          $encoding = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'release-notes.md'), $notes, $encoding)
          $ErrorActionPreference = 'Continue'
          gh release view $tag --json id 2>$null | Out-Null
          $exists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($exists) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --target $env:RELEASE_COMMIT --title "YunX HTTP $version (build $env:RELEASE_BUILD)" --notes-file release-notes.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
          $url = gh release view $tag --json url --jq '.url'
          if ($LASTEXITCODE -ne 0) { throw 'Could not read published Release URL' }
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "Release: $url`n", $encoding)
